<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Panda ❤️</title>

<style>
body{
margin:0;
padding:0;
background:linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.container{
max-width:600px;
padding:30px;
background:rgba(255,255,255,0.05);
border-radius:20px;
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(0,0,0,.5);
}

h1{
font-size:42px;
color:#ff4d6d;
text-shadow:0 0 15px rgba(255,77,109,.7);
margin-bottom:10px;
}

<h2 style="line-height:1.8;color:#f5f5f5;">
26 July ❤️<br><br>

Two years...<br>
Countless memories...<br>
Infinite love... ♾️❤️<br><br>

No matter where life takes us,<br>
I'll always choose you.<br><br>

Forever Yours,<br>
<b>Your Panda 🐼❤️</b>
</h2>

button{
background:#ff4d6d;
color:white;
border:none;
padding:14px 28px;
font-size:18px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#memory{
margin-top:25px;
font-size:20px;
opacity:0;
transition:opacity 1s;
}

#memory.show{
opacity:1;
}
</style>
</head>

<body>

<div class="container">
<h1>Happy 2nd Anniversary ❤️</h1>

<h2>
26 July — Our Little Forever 🐼<br>
This is just the beginning of our story...
</h2>

<button onclick="showMessage()">
Open Our Memories 💌
</button>

<p id="memory"></p>

</div>

<script>
function showMessage(){
const m=document.getElementById("memory");
m.innerHTML="Two years of smiles, fights, memories and moments ❤️<br>And this is just the beginning... Forever, Panda 🐼";
m.classList.add("show");
}
</script>

</body>
</html>
