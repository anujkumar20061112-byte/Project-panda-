<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 2nd Anniversary ❤️</title>

<style>
body{
margin:0;
padding:0;
background:linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e);
font-family:Arial,sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:800px;
background:rgba(255,255,255,.05);
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,.5);
}

h1{
text-align:center;
color:#ff4d6d;
font-size:40px;
text-shadow:0 0 15px #ff4d6d;
}

.subtitle{
text-align:center;
font-size:20px;
line-height:1.8;
margin-top:20px;
}

button{
display:block;
margin:30px auto;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:light pink and some heart;
cursor:pointer;
}

#memory{
display:none;
font-size:18px;
line-height:2;
white-space:pre-line;
margin-top:30px;
}

/* ===== Background Stars ===== */

#stars{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
0%{opacity:.2;transform:scale(1);}
100%{opacity:1;transform:scale(2);}
}

/* ===== Floating Hearts ===== */

#hearts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:0;
}

.heart{
position:absolute;
bottom:-40px;
font-size:22px;
animation:floatHeart 8s linear forwards;
opacity:.8;
}

@keyframes floatHeart{
0%{
transform:translateY(0) scale(.7);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.4);
opacity:0;
}
}

/* Container hamesha upar rahe */

.container{
position:relative;
z-index:10;
}

</style>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

</head>

// ⭐ Create Stars
for(let i=0;i<80;i++){
